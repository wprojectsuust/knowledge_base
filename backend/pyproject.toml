[project]
name = "uunit-knowledge-base"
version = "0.1.0"
description = "RAG-baza znaniy UUNiT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx[socks]>=0.27.0",
    "openai>=1.50.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "asyncpg>=0.29.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing -m \"not integration and not e2e\""
asyncio_mode = "auto"
markers = [
    "integration: talks to a real Postgres/Chroma (docker compose up), no mocks",
    "e2e: hits the actual running HTTP server end to end, needs the full stack up",
]
